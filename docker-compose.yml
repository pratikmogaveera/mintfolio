services:
  postgres:
    container_name: mintfolio-pg
    image: 'postgres:18'
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=mintfolio
    volumes:
      - pgdata:/var/lib/postgresql

  redis:
    container_name: mintfolio-redis
    image: 'redis:8'
    ports:
      - "6379:6379"

volumes:
  pgdata: